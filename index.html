<!DOCTYPE html>
<html class="light scroll-smooth" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Portfolio de Loqmann Benhaddya</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/tailwind-config.js"></script>
</head>

<body class="bg-cream antialiased overflow-x-hidden selection:bg-antique-gold/20 selection:text-berkeley-blue">

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 w-full bg-cream/90 backdrop-blur-md border-b border-berkeley-blue/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center gap-3 group">
                    <div
                        class="w-10 h-10 flex items-center justify-center rounded-sm bg-berkeley-blue text-white shadow-sm group-hover:bg-berkeley-blue/90 transition-colors border border-berkeley-blue">
                        <span class="font-serif font-bold text-xl italic" id="nav-initials">LB</span>
                    </div>
                    <h1
                        class="text-lg font-bold tracking-tight text-berkeley-blue group-hover:text-antique-gold transition-colors duration-300 font-serif">
                        Loqmann Benhaddya
                    </h1>
                </div>
                <div class="hidden md:flex flex-1 justify-end gap-10 items-center">
                    <a class="text-xs font-bold text-slate-600 hover:text-berkeley-blue transition-colors uppercase tracking-[0.15em]"
                        href="#distinctions">Distinctions</a>
                    <a class="text-xs font-bold text-slate-600 hover:text-berkeley-blue transition-colors uppercase tracking-[0.15em]"
                        href="#projets">Projets</a>
                    <a class="text-xs font-bold text-slate-600 hover:text-berkeley-blue transition-colors uppercase tracking-[0.15em]"
                        href="#medias">Médias</a>
                    <a class="text-xs font-bold text-slate-600 hover:text-berkeley-blue transition-colors uppercase tracking-[0.15em]"
                        href="#apropos">À Propos</a>
                    <a class="hidden lg:flex items-center justify-center h-10 px-6 bg-berkeley-blue hover:bg-[#002142] text-white text-[10px] font-bold uppercase tracking-[0.2em] transition-all shadow-md hover:shadow-lg"
                        href="#contact">
                        Contact
                    </a>
                </div>
                <div class="md:hidden">
                    <button class="text-berkeley-blue hover:text-antique-gold">
                        <span class="material-symbols-outlined">menu</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="relative pt-20 pb-24 lg:pt-32 lg:pb-40 overflow-hidden min-h-[90vh] flex items-center">
        <div class="absolute inset-0 bg-texture pointer-events-none"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-cream/30 to-cream pointer-events-none"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 w-full">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-16 lg:gap-12 items-center">
                <div class="order-2 lg:order-1 lg:col-span-7 flex flex-col justify-center text-left">
                    <div class="flex items-center gap-3 mb-6 opacity-0 animate-[fadeIn_0.6s_ease-out_forwards]">
                        <div class="h-[1px] w-12 bg-antique-gold"></div>
                        <span class="text-antique-gold font-sans font-bold tracking-[0.25em] uppercase text-[11px]"
                            id="hero-subtitle-prefix"></span>
                    </div>
                    <h1
                        class="text-5xl sm:text-6xl lg:text-8xl font-serif font-medium text-berkeley-blue leading-[1.1] mb-6 tracking-tight opacity-0 animate-[fadeIn_0.6s_ease-out_0.2s_forwards]">
                        <span id="hero-title-first"></span> <br class="hidden sm:block" /> <span
                            id="hero-title-last"></span>
                    </h1>
                    <div
                        class="pl-0 lg:pl-0 border-l-0 lg:border-l-0 opacity-0 animate-[fadeIn_0.6s_ease-out_0.4s_forwards]">
                        <div class="lg:max-w-xl">
                            <h2 class="text-xl sm:text-2xl font-serif text-berkeley-blue/90 mb-4 italic" id="hero-role">
                            </h2>
                            <p class="text-lg font-light text-slate-600 leading-relaxed" id="hero-description"></p>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-5 mt-10 opacity-0 animate-[fadeIn_0.6s_ease-out_0.6s_forwards]">
                        <a class="group relative px-8 py-4 bg-berkeley-blue text-white overflow-hidden shadow-lg transition-all hover:shadow-xl hover:-translate-y-1 rounded-sm"
                            href="#" id="hero-cta-primary-link">
                            <div
                                class="absolute inset-0 w-full h-full bg-[#002142] translate-y-full transition-transform duration-300 group-hover:translate-y-0">
                            </div>
                            <span
                                class="relative flex items-center gap-2 font-sans text-xs font-bold tracking-[0.15em] uppercase"
                                id="hero-cta-primary"></span>
                        </a>
                        <a class="group px-8 py-4 bg-transparent border border-berkeley-blue/20 text-berkeley-blue hover:border-berkeley-blue hover:bg-berkeley-blue/5 transition-all rounded-sm"
                            href="#" id="hero-cta-secondary-link">
                            <span
                                class="flex items-center gap-2 font-sans text-xs font-bold tracking-[0.15em] uppercase"
                                id="hero-cta-secondary"></span>
                        </a>
                    </div>
                    <div class="flex items-center gap-10 mt-16 pt-8 border-t border-berkeley-blue/10 opacity-0 animate-[fadeIn_0.6s_ease-out_0.8s_forwards]"
                        id="hero-stats">
                        <!-- Stats injected by JS -->
                    </div>
                </div>
                <div
                    class="order-1 lg:order-2 lg:col-span-5 flex justify-center lg:justify-end relative items-center opacity-0 animate-[fadeIn_0.8s_ease-out_0.4s_forwards]">
                    <div class="relative w-full max-w-[420px] aspect-[4/5]">
                        <div
                            class="absolute top-8 -right-8 w-full h-full border border-berkeley-blue/10 z-0 hidden md:block">
                        </div>
                        <div class="absolute -bottom-8 -left-8 w-64 h-64 bg-antique-gold/10 rounded-full blur-3xl z-0">
                        </div>
                        <div class="relative h-full w-full shadow-2xl z-10 bg-cream p-3 border border-berkeley-blue/5">
                            <div class="relative w-full h-full overflow-hidden bg-berkeley-blue">
                                <div
                                    class="absolute inset-0 bg-berkeley-blue/20 mix-blend-multiply z-20 pointer-events-none">
                                </div>
                                <div id="hero-image"
                                    class="w-full h-full bg-cover bg-center grayscale transition-all duration-1000 ease-out hover:grayscale-0 hover:scale-105">
                                </div>
                                <div class="absolute inset-0 border-[1px] border-white/30 z-30 m-3 pointer-events-none">
                                </div>
                            </div>
                        </div>
                        <div
                            class="absolute -bottom-6 -right-4 z-40 bg-white p-4 shadow-xl border border-berkeley-blue/5 max-w-[180px] hidden sm:block">
                            <div class="flex flex-col gap-1">
                                <span class="material-symbols-outlined text-antique-gold text-2xl"
                                    id="hero-badge-icon"></span>
                                <p class="font-serif text-sm font-bold text-berkeley-blue mt-1" id="hero-badge-text">
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Distinctions Section -->
    <section class="py-24 bg-white border-y border-berkeley-blue/5" id="distinctions">
        <div class="max-w-5xl mx-auto px-4 sm:px-6">
            <div class="mb-16 text-center">
                <h2 class="text-4xl font-serif text-berkeley-blue mb-4" id="distinctions-title"></h2>
                <div class="h-[1px] w-24 bg-antique-gold mx-auto"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-[80px_1fr] gap-x-8 gap-y-12 relative" id="distinctions-list">
                <!-- Distinctions injected by JS -->
            </div>
        </div>
    </section>

    <!-- Projects Section -->
    <section class="py-24 bg-cream" id="projets">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-end mb-16 gap-6">
                <div class="text-left">
                    <span class="text-antique-gold font-bold tracking-widest uppercase text-xs mb-2 block"
                        id="projects-subtitle"></span>
                    <h2 class="text-4xl font-serif text-berkeley-blue" id="projects-title"></h2>
                </div>
                <a class="hidden md:flex items-center gap-3 text-xs font-bold uppercase tracking-widest text-berkeley-blue hover:text-antique-gold transition-colors group view-all-projects"
                    href="#">
                    <!-- View all text injected by JS -->
                </a>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10" id="projects-grid">
                <!-- Projects injected by JS -->
            </div>
            <div class="mt-12 text-center md:hidden">
                <a class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-berkeley-blue hover:text-antique-gold transition-colors view-all-projects"
                    href="#">
                    <!-- View all text injected by JS -->
                </a>
            </div>
        </div>
    </section>

    <!-- Media Section -->
    <section class="py-24 bg-white border-y border-berkeley-blue/5" id="medias">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-20">
                <span class="text-antique-gold font-bold tracking-widest uppercase text-xs mb-2 block"
                    id="media-subtitle"></span>
                <h2 class="text-4xl font-serif text-berkeley-blue mb-4" id="media-title"></h2>
                <div class="h-[1px] w-24 bg-antique-gold mx-auto mb-6"></div>
                <p class="text-slate-500 max-w-2xl mx-auto font-light italic" id="media-quote"></p>
            </div>
            <div class="flex flex-wrap justify-center items-center gap-16 lg:gap-32" id="media-list">
                <!-- Media items injected by JS -->
            </div>
        </div>
    </section>

    <!-- About Section -->
    <section class="py-24 bg-cream" id="apropos">
        <div class="max-w-6xl mx-auto px-4 sm:px-6">
            <div class="bg-white rounded-sm p-8 md:p-16 shadow-xl border border-berkeley-blue/5">
                <div class="flex flex-col md:flex-row gap-16 items-start">
                    <div class="flex-1">
                        <span class="text-antique-gold font-bold tracking-widest uppercase text-xs mb-3 block"
                            id="about-subtitle"></span>
                        <h2 class="text-4xl font-serif text-berkeley-blue mb-8 leading-tight" id="about-title"></h2>
                        <div class="text-slate-700 leading-8 font-light space-y-6 text-lg" id="about-text">
                            <!-- About text injected by JS -->
                        </div>
                        <div class="mt-12 pt-8 border-t border-slate-100 flex items-center gap-6">
                            <img alt="Signature" id="about-signature-img"
                                class="w-20 h-20 rounded-full object-cover grayscale border-2 border-white shadow-md"
                                src="" />
                            <div>
                                <p class="font-serif font-bold text-xl text-berkeley-blue" id="about-name"></p>
                                <p class="text-xs font-bold uppercase tracking-widest text-antique-gold mt-1"
                                    id="about-role"></p>
                            </div>
                        </div>
                    </div>
                    <div class="hidden md:block w-1/3 sticky top-32">
                        <div
                            class="relative w-full aspect-[3/4] bg-berkeley-blue rounded-sm overflow-hidden shadow-2xl border-4 border-white">
                            <div id="about-quote-bg"
                                class="absolute inset-0 bg-cover bg-center opacity-60 mix-blend-luminosity hover:mix-blend-normal transition-all duration-700">
                            </div>
                            <div class="absolute inset-0 flex items-center justify-center p-8 bg-berkeley-blue/20">
                                <div class="border border-white/30 p-8 w-full h-full flex items-center justify-center">
                                    <span class="font-serif text-white/90 text-center text-2xl italic leading-relaxed"
                                        id="about-quote-text"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section class="py-24 bg-white border-t border-berkeley-blue/5" id="contact">
        <div class="max-w-4xl mx-auto px-4 sm:px-6">
            <div class="text-center mb-12">
                <h2 class="text-4xl font-serif text-berkeley-blue mb-4" id="contact-title"></h2>
                <div class="h-[1px] w-24 bg-antique-gold mx-auto mb-6"></div>
                <p class="text-slate-500 font-light" id="contact-subtitle"></p>
            </div>
            <div
                class="bg-cream rounded-sm shadow-2xl border border-berkeley-blue/10 overflow-hidden flex flex-col min-h-[500px]">
                <div class="bg-berkeley-blue p-5 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="relative">
                            <div
                                class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center text-white border border-white/20">
                                <span class="material-symbols-outlined">smart_toy</span>
                            </div>
                            <div
                                class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-berkeley-blue rounded-full">
                            </div>
                        </div>
                        <div>
                            <p class="font-serif font-bold text-lg text-white">Loqmann AI Twin</p>
                            <p class="text-xs text-white/60 uppercase tracking-widest">Assistant Virtuel</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <div class="w-2 h-2 rounded-full bg-white/30"></div>
                        <div class="w-2 h-2 rounded-full bg-white/30"></div>
                        <div class="w-2 h-2 rounded-full bg-white/30"></div>
                    </div>
                </div>
                <div class="flex-1 p-8 flex flex-col gap-6 overflow-y-auto bg-white">
                    <div class="flex gap-4 max-w-[85%]">
                        <div
                            class="w-8 h-8 rounded-full bg-berkeley-blue/5 flex-shrink-0 flex items-center justify-center text-berkeley-blue mt-1">
                            <span class="material-symbols-outlined text-sm">smart_toy</span>
                        </div>
                        <div
                            class="bg-cream p-6 rounded-lg rounded-tl-none shadow-sm text-slate-700 border border-slate-100 font-light leading-relaxed">
                            <p id="contact-intro-message"></p>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-3 mt-auto justify-end" id="contact-suggestions">
                        <!-- Suggestions injected by JS -->
                    </div>
                </div>
                <div class="p-5 bg-cream border-t border-slate-200">
                    <div
                        class="flex items-center gap-3 bg-white rounded-sm px-4 py-3 border border-slate-200 focus-within:border-berkeley-blue focus-within:ring-1 focus-within:ring-berkeley-blue transition-all shadow-sm">
                        <input
                            class="bg-transparent border-none focus:ring-0 text-sm w-full text-berkeley-blue placeholder-slate-400 font-light"
                            placeholder="Posez votre question..." type="text" />
                        <button class="text-berkeley-blue hover:text-antique-gold p-1 transition-colors">
                            <span class="material-symbols-outlined">send</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="flex justify-center gap-12 mt-16" id="contact-socials">
                <!-- Socials injected by JS -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-12 bg-berkeley-blue text-center border-t border-white/10">
        <div class="flex flex-col items-center gap-4">
            <div class="w-10 h-10 flex items-center justify-center border border-white/20 text-white font-serif italic text-lg mb-2"
                id="footer-initials"></div>
            <p class="text-sm text-white/60 font-light" id="footer-copyright">
            </p>
            <p class="text-xs text-antique-gold uppercase tracking-widest opacity-80" id="footer-tagline">
            </p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
